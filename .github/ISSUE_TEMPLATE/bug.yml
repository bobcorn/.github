name: Bug report
description: Report a reproducible problem.
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is happening?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should happen instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: How can the problem be reproduced?
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Optional context such as logs, environment details, screenshots, or hypotheses.
    validations:
      required: false
